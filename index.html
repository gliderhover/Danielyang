<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daniel Yang | Ask me</title>
    <meta name="description" content="Ask Daniel Yang anything about his career, projects and experience, by voice or text." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./chat/voice.css" />
  </head>
  <body>
    <header class="bar">
      <a class="bar-name" href="./index.html">Daniel Yang</a>
      <div class="bar-tools">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="zh" aria-pressed="false">中文</button>
        </div>
        <button type="button" class="sound" id="sound" aria-pressed="true" data-i18n-title="soundTitle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /></svg>
          <span data-i18n="soundOn">Voice on</span>
        </button>
        <a class="classic" href="./classic.html" data-i18n="classic">Classic site</a>
      </div>
    </header>

    <main class="stage" id="stage">
      <section class="intro">
        <h1 data-i18n="headline">What do you want to know about me?</h1>
        <p class="lede" data-i18n="lede">
          I'm an AI version of Daniel Yang, built from his résumé and projects. Ask out loud or type.
        </p>
        <div class="starters" id="starters"></div>
      </section>

      <ol class="transcript" id="transcript" aria-live="polite"></ol>
    </main>

    <div class="dock">
      <canvas class="skyline" id="skyline" aria-hidden="true"></canvas>
      <div class="dock-inner">
        <fieldset class="styles">
          <legend data-i18n="styleLegend">Answer style</legend>
          <div class="style-options" id="styles"></div>
        </fieldset>

        <form class="composer" id="composer" autocomplete="off">
          <button type="button" class="mic" id="mic" data-i18n-aria="micStart">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
            </svg>
          </button>
          <label class="visually-hidden" for="question" data-i18n="inputLabel">Your question</label>
          <input id="question" name="question" maxlength="600" data-i18n-placeholder="placeholder" placeholder="Type a question…" />
          <button type="submit" class="ask" id="ask" data-i18n="ask">Ask</button>
        </form>
        <p class="status" id="status" role="status"></p>
      </div>
    </div>

    <script src="./chat/config.js?v=2"></script>
    <script src="./chat/voice.js"></script>
  </body>
</html>
